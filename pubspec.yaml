name: food_delivery_rider
description: "Rider app for the multi-vendor food delivery demo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- networking & state ---
  dio: ^5.4.0
  provider: ^6.1.2

  # --- maps & location ---
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # --- storage & formatting ---
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
